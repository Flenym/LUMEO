# Lumeo — XcodeGen project (main app).
# Generated project: run `xcodegen generate` inside iOSApp/ (CI installs xcodegen via brew).
# NEVER hardcode API URLs in code — they come from Config/*.xcconfig via
# Info.plist keys APIBaseURL / WSBaseURL / EmberCurrencyName.
name: Lumeo
options:
  bundleIdPrefix: com.lumeo.app
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Development: debug
  Beta: release
  Production: release

configFiles:
  Development: Config/Development.xcconfig
  Beta: Config/Beta.xcconfig
  Production: Config/Production.xcconfig

settings:
  CODE_SIGNING_ALLOWED: NO
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "6.0"

targets:
  LumeoApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.app
    sources:
      - path: Sources
    # ВАЖНО: xcodegen требует info.path (properties без path не декодируются:
    # "Decoding failed at path"). Значения $(...) подставляет Xcode из xcconfig.
    info:
      path: Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.app
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - target: LumeoWidgets
      - target: LumeoLiveActivity

  LumeoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.app.widgets
    sources:
      - path: Widgets
        excludes:
          - Info.plist
    # Без явного Info.plist xcodebuild не грузит Info dictionary appex.
    info:
      path: Widgets/Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.app.widgets
      # Явный INFOPLIST_FILE + дублирование NSExtension через build settings:
      # симулятор требует extensionDictionary в установленном appex.
      INFOPLIST_FILE: Widgets/Info.plist
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # Пост-штамп NSExtension в собранный appex: builtin-infoPlistUtility
    # иногда теряет словарь — скрипт гарантирует его наличие (видно в CI-дампе).
    postBuildScripts:
      - name: Stamp NSExtension (sim install requires extensionDictionary)
        script: |
          set -euo pipefail
          PLIST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSExtension" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$PLIST"
          echo "Stamped NSExtension into $PLIST"

  LumeoLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.app.liveactivity
    sources:
      - path: LiveActivities
        excludes:
          - Info.plist
      # Shared models: экстеншен — отдельный таргет и видит только свои sources.
      # Дублирование value-типов (GameSession и др.) безопасно.
      - path: Sources/Core/Models.swift
      - path: Sources/Theme/AppTheme.swift
    info:
      path: LiveActivities/Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.app.liveactivity
      INFOPLIST_FILE: LiveActivities/Info.plist
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: Stamp NSExtension (sim install requires extensionDictionary)
        script: |
          set -euo pipefail
          PLIST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSExtension" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$PLIST"
          echo "Stamped NSExtension into $PLIST"

  LumeoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.app.tests
    sources:
      - path: Tests
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.app.tests
    dependencies:
      - target: LumeoApp

  # UI-тесты — отдельным bundle.ui-testing таргетом (XCUI нельзя класть в unit bundle).
  # TEST_TARGET_NAME обязателен: без него XCUIApplication init падает
  # (Assertion failure — раннер не знает target application).
  LumeoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.app.uitests
    sources:
      - path: UITests
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.app.uitests
      TEST_TARGET_NAME: LumeoApp

schemes:
  Lumeo:
    build:
      targets:
        LumeoApp: all
    run:
      config: Development
    test:
      config: Development
      targets:
        - LumeoTests
        - LumeoUITests
    archive:
      config: Production
