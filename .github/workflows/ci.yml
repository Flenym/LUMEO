name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: монорепо на npm workspaces (Backend + Shared), единый корневой
# package-lock.json. Поэтому `npm ci` всегда в корне, дальше — --workspace.
# iOS: Xcode latest (нужен SDK iOS 26 + Swift 6), симулятор iPhone 17.

jobs:
  shared:
    name: shared (node build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=Shared
      - run: npm run typecheck --workspace=Shared

  backend:
    name: backend (build/test/integration/seed-validate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumeo
          POSTGRES_PASSWORD: lumeo
          POSTGRES_DB: lumeo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumeo"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgres://lumeo:lumeo@localhost:5432/lumeo_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=Backend
      - run: npm test --workspace=Backend
      - name: Seed-validate (apply migrations to throwaway Postgres)
        run: |
          echo "==> expected migrations: 001_init + 002_constraints + 003_seed"
          for f in migrations/001_init.sql migrations/002_constraints.sql migrations/003_seed.sql; do
            test -f "Backend/$f" || { echo "ERROR: Backend/$f missing"; exit 1; }
          done
          for f in Backend/migrations/*.sql; do
            echo "==> applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DATABASE_URL" -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"

  ios-build:
    name: ios-build (xcodegen + compile both apps, no tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using Xcode: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate projects
        run: |
          ( cd iOSApp && xcodegen generate )
          ( cd AdminApp && xcodegen generate )
      - name: Pick available iPhone simulator (runners differ)
        id: sim
        run: |
          # Раннеры macos-15 разные: где-то нет iPhone 17. Берём первый
          # доступный iPhone (предпочитаем 17), иначе создаём.
          SIM_NAME="$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs=[d for rts in json.load(sys.stdin).get('devices',{}).values() for d in rts if d.get('isAvailable',True) and 'iPhone' in d.get('name','')]
          for want in ('iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17','iPhone 16'):
              for d in devs:
                  if d['name']==want: print(want); raise SystemExit
          print(devs[0]['name'] if devs else '')
          ")"
          if [ -z "$SIM_NAME" ]; then
            echo "No iPhone simulator found — creating one"
            RUNTIME="$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x['identifier'] for x in json.load(sys.stdin).get('runtimes',[]) if x.get('isAvailable',True) and 'iOS' in x.get('identifier','')]; print(sorted(r)[-1] if r else '')")"
            DEVTYPE="$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=json.load(sys.stdin).get('devicetypes',[]); ids=[x['identifier'] for x in d if 'iPhone' in x.get('name','')]; print(next((i for i in sorted(ids,reverse=True) if 'iPhone-17' in i), sorted(ids)[-1] if ids else ''))")"
            xcrun simctl create "CI-iPhone" "$DEVTYPE" "$RUNTIME"
            SIM_NAME="CI-iPhone"
          fi
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_NAME"
      - name: Build for testing (main + admin schemes)
        run: |
          xcodebuild build-for-testing \
            -project iOSApp/Lumeo.xcodeproj \
            -scheme Lumeo \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          xcodebuild build-for-testing \
            -project AdminApp/LumeoAdmin.xcodeproj \
            -scheme LumeoAdmin \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  ios-lint:
    name: ios-lint (swiftlint/swiftformat, non-blocking)
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint Swift (best-effort)
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --strict iOSApp/Sources AdminApp/Sources || true
          else
            echo "NOTE: swiftlint not installed — lint skipped (non-blocking)"
          fi

  ios-main:
    name: ios-main (xcodegen + build-for-testing + xctest + screenshots)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (needs iOS 26 SDK + Swift 6)
        run: |
          ls -d /Applications/Xcode*.app
          # /Applications/Xcode.app может указывать на старый 16.x —
          # берём максимальный по версии (Xcode 26+ для iOS 26 SDK).
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using Xcode: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devicetypes | grep -i iphone | head -5 || true
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate projects
        run: |
          ( cd iOSApp && xcodegen generate )
          ( cd AdminApp && xcodegen generate )
      - name: Pick available iPhone simulator (runners differ)
        id: sim
        run: |
          SIM_NAME="$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs=[d for rts in json.load(sys.stdin).get('devices',{}).values() for d in rts if d.get('isAvailable',True) and 'iPhone' in d.get('name','')]
          for want in ('iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17','iPhone 16'):
              for d in devs:
                  if d['name']==want: print(want); raise SystemExit
          print(devs[0]['name'] if devs else '')
          ")"
          if [ -z "$SIM_NAME" ]; then
            echo "No iPhone simulator found — creating one"
            RUNTIME="$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x['identifier'] for x in json.load(sys.stdin).get('runtimes',[]) if x.get('isAvailable',True) and 'iOS' in x.get('identifier','')]; print(sorted(r)[-1] if r else '')")"
            DEVTYPE="$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=json.load(sys.stdin).get('devicetypes',[]); ids=[x['identifier'] for x in d if 'iPhone' in x.get('name','')]; print(next((i for i in sorted(ids,reverse=True) if 'iPhone-17' in i), sorted(ids)[-1] if ids else ''))")"
            xcrun simctl create "CI-iPhone" "$DEVTYPE" "$RUNTIME"
            SIM_NAME="CI-iPhone"
          fi
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_NAME"
      - name: Verify xcconfig wiring (ground truth)
        run: |
          echo "=== xcconfig as seen by runner ==="
          cat -A iOSApp/Config/Development.xcconfig | head -8 || true
          echo "=== pbxproj baseConfiguration refs ==="
          grep -c "baseConfigurationReference" iOSApp/Lumeo.xcodeproj/project.pbxproj || echo "(none!)"
          grep -m3 -B2 -A1 "Development.xcconfig\|Beta.xcconfig" iOSApp/Lumeo.xcodeproj/project.pbxproj || echo "(no xcconfig file refs)"
          echo "=== resolved build setting ==="
          xcodebuild -showBuildSettings -project iOSApp/Lumeo.xcodeproj -scheme Lumeo -configuration Development 2>/dev/null | grep -m4 -i "API_BASE_URL\|WS_BASE_URL\|CONFIGURATION_BUILD_DIR" || true
      - name: Build for testing (main scheme)
        run: |
          xcodebuild build-for-testing \
            -project iOSApp/Lumeo.xcodeproj \
            -scheme Lumeo \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Debug appex Info.plist (ground truth for sim install)
        if: always()
        run: |
          find DerivedData/Build/Products/Development-iphonesimulator -maxdepth 3 -name "*.appex" | head -5 || true
          for APP in DerivedData/Build/Products/Development-iphonesimulator/*.app/PlugIns/*.appex; do
            echo "== $APP/Info.plist"
            plutil -p "$APP/Info.plist" 2>&1 | head -40 || echo "(no Info.plist)"
          done
      - name: Test unit (engines/rules, in-process, fast)
        run: |
          xcodebuild test-without-building \
            -project iOSApp/Lumeo.xcodeproj \
            -scheme Lumeo \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/LumeoUnit.xcresult \
            -only-testing:LumeoTests
      - name: Build for testing (admin scheme)
        run: |
          xcodebuild build-for-testing \
            -project AdminApp/LumeoAdmin.xcodeproj \
            -scheme LumeoAdmin \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Test AdminApp (unit + ban/audit UI)
        run: |
          xcodebuild test-without-building \
            -project AdminApp/LumeoAdmin.xcodeproj \
            -scheme LumeoAdmin \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/LumeoAdminTests.xcresult \
            -retry-tests-on-failure
      - name: Test UI (7 critical flows, retry flaky cold-start aborts)
        # БЕЗ -only-testing: фильтр по UI-бандлу даёт "Executed 0 tests",
        # полный прогон схемы многократно доказан зелёным (юниты повторятся — это ~2с).
        run: |
          xcodebuild test-without-building \
            -project iOSApp/Lumeo.xcodeproj \
            -scheme Lumeo \
            -configuration Development \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM_NAME }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/LumeoTests.xcresult \
            -retry-tests-on-failure
      - name: Sim crash log (who read ThemeManager without provider?)
        if: failure()
        env:
          SIM_NAME: ${{ steps.sim.outputs.SIM_NAME }}
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,os,sys; want=os.environ.get('SIM_NAME',''); d=json.load(sys.stdin); print(next((x['udid'] for rt in d.get('devices',{}).values() for x in rt if x.get('name')==want),''))")"
          echo "SIM: $UDID"
          xcrun simctl spawn "$UDID" log show --predicate 'process == "LumeoApp"' --info --last 10m 2>/dev/null | grep -B5 -A40 -i "fatal error" | head -100 || true
          echo "=== host crash reports (both apps) ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -iE "lumeo" | head -8 || echo "(none)"
          for APP in LumeoApp LumeoAdmin; do
            LATEST="$(ls -t ~/Library/Logs/DiagnosticReports/${APP}*.ips 2>/dev/null | head -1 || true)"
            if [ -n "$LATEST" ]; then
              echo "--- $LATEST ---"
              python3 -c "
          import json,sys
          d = json.load(open(sys.argv[1]))
          print('termination:', json.dumps(d.get('termination',{}))[:400])
          for t in (d.get('threads') or []):
              fr = t.get('frames',[])[:15]
              syms = ' '.join(f.get('symbol','') for f in fr)
              if 'Lumeo' in syms or 'SwiftUI' in syms:
                  print('--- thread ---')
                  [print(' ', f.get('symbol','?')) for f in fr]
                  break
          " "$LATEST" | head -30
            fi
          done
          echo "=== built app Info.plist URL keys (substitution check) ==="
          for APP in DerivedData/Build/Products/Development-iphonesimulator/LumeoApp.app; do
            /usr/libexec/PlistBuddy -c "Print :APIBaseURL" "$APP/Info.plist" 2>&1 || true
            /usr/libexec/PlistBuddy -c "Print :WSBaseURL" "$APP/Info.plist" 2>&1 || true
          done
          echo "=== host crash reports ==="
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i lumeo | head -5 || echo "(no lumeo crash reports)"
          LATEST="$(ls -t ~/Library/Logs/DiagnosticReports/LumeoApp*.ips 2>/dev/null | head -1 || true)"
          if [ -n "$LATEST" ]; then
            echo "--- $LATEST (backtrace) ---"
            python3 -c "
          import json,sys
          d = json.load(open(sys.argv[1]))
          print('termination:', json.dumps(d.get('termination',{}))[:500])
          for t in d.get('threads',[]):
              fr = t.get('frames',[])[:12]
              if any('ThemeManager' in str(f) or 'Environment' in str(f) or 'LumeoApp' in str(f.get('symbol','')) for f in fr):
                  print('--- thread (app frames) ---')
                  [print(' ', f.get('symbol','?'), '@', f.get('image','?')) for f in fr]
                  break
          " "$LATEST" | head -40
          fi
      - name: Screenshots (export UITest attachments, no re-run)
        if: always()
        run: chmod +x scripts/screenshots.sh && ./scripts/screenshots.sh --out screenshots --attachments-only TestResults
      - name: Upload screenshots / test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          # Только PNG: полные .xcresult весят сотни МБ и убивают скачивание.
          path: screenshots/**/*.png

  ipa-main:
    name: ipa-main (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    # IPA зависит только от успешной СБОРКИ, а не от тестов:
    # артефакты доступны, даже пока чинятся flaky UI-тесты.
    needs: [ios-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using Xcode: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Build unsigned IPA (main)
        run: chmod +x scripts/build-unsigned-ipa.sh && ./scripts/build-unsigned-ipa.sh --scheme Lumeo --project iOSApp/Lumeo.xcodeproj --config Production --output Lumeo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Lumeo-unsigned.ipa
          path: Lumeo-unsigned.ipa

  ipa-admin:
    name: ipa-admin (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    needs: [ios-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using Xcode: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Build unsigned IPA (admin)
        run: chmod +x scripts/build-unsigned-ipa.sh && ./scripts/build-unsigned-ipa.sh --scheme LumeoAdmin --project AdminApp/LumeoAdmin.xcodeproj --config Production --output Lumeo-Admin-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Lumeo-Admin-unsigned.ipa
          path: Lumeo-Admin-unsigned.ipa

  secrets-guard:
    name: secrets-guard (no secrets in repo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: chmod +x scripts/secrets-scan.sh && ./scripts/secrets-scan.sh

  visual-qa:
    name: visual-qa (pixel-diff vs golden, threshold 5%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ios-main]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots
      - name: Pixel-diff current vs Design/golden
        run: |
          echo "==> visual-qa: threshold 5% per screen"
          if [ ! -d "Design/golden" ] || [ -z "$(ls -A Design/golden 2>/dev/null || true)" ]; then
            echo "WARNING: Design/golden/ is empty — no baselines yet. Screenshots collected for review, diff skipped."
            exit 0
          fi
          pip install --quiet pillow 2>/dev/null || true
          python3 - "$@" <<'EOF'
          import os, sys
          from PIL import Image, ImageChops
          golden_dir, current_dir = "Design/golden", "screenshots"
          threshold, failures = 0.05, []
          for name in os.listdir(golden_dir):
              g = os.path.join(golden_dir, name)
              cands = [os.path.join(r, name) for r, _, fs in os.walk(current_dir) for f in fs if f == name]
              if not cands:
                  print(f"MISSING current screenshot for golden {name}")
                  failures.append(name); continue
              a = Image.open(g).convert("RGB")
              b = Image.open(cands[0]).convert("RGB").resize(a.size)
              diff = ImageChops.difference(a, b)
              hist = diff.histogram()
              # fraction of channels with non-trivial difference
              total = a.size[0] * a.size[1] * 3
              changed = sum(n for i, n in enumerate(hist) if (i % 256) > 12)
              ratio = changed / total
              print(f"{name}: diff={ratio:.3%} (threshold={threshold:.0%})")
              if ratio > threshold: failures.append(name)
          if failures:
              print(f"FAIL: {len(failures)} screen(s) exceed threshold: {failures}")
              sys.exit(1)
          print("OK: all screens within threshold")
          EOF
