# LumeoAdmin — XcodeGen project (admin app, separate bundle).
# Generated project: run `xcodegen generate` inside AdminApp/ (CI installs xcodegen via brew).
# Admin API base URL lives in per-config settings below — never hardcoded in code.
# (Shared Config/*.xcconfig live in iOSApp/Config; AdminApp keeps inline values
# so this directory contains only project.yml besides Sources/Tests/UITests.)
name: LumeoAdmin
options:
  bundleIdPrefix: com.lumeo.admin
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Development: debug
  Beta: release
  Production: release

settings:
  CODE_SIGNING_ALLOWED: NO
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "6.0"
  configs:
    Development:
      API_BASE_URL: http://localhost:5267
      WS_BASE_URL: ws://localhost:5267/ws
      EMBER_CURRENCY_NAME: EMBER
    Beta:
      # Реальный домен (2026-10-04): https://lumeo.cloudpub.ru.
      API_BASE_URL: https://lumeo.cloudpub.ru
      WS_BASE_URL: wss://lumeo.cloudpub.ru/ws
      EMBER_CURRENCY_NAME: EMBER
    Production:
      # Реальный домен (2026-10-04): https://lumeo.cloudpub.ru.
      API_BASE_URL: https://lumeo.cloudpub.ru
      WS_BASE_URL: wss://lumeo.cloudpub.ru/ws
      EMBER_CURRENCY_NAME: EMBER

targets:
  LumeoAdmin:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.admin
    sources:
      - path: Sources
    # ВАЖНО: xcodegen требует info.path (properties без path не декодируются).
    info:
      path: Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.admin
    dependencies: []

  LumeoAdminTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.admin.tests
    sources:
      - path: Tests
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.admin.tests
    dependencies:
      - target: LumeoAdmin

  # UI-тесты — отдельным bundle.ui-testing таргетом.
  # TEST_TARGET_NAME обязателен (см. комментарий в iOSApp/project.yml).
  LumeoAdminUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.lumeo.admin.uitests
    sources:
      - path: UITests
    settings:
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.lumeo.admin.uitests
      TEST_TARGET_NAME: LumeoAdmin

schemes:
  LumeoAdmin:
    build:
      targets:
        LumeoAdmin: all
    run:
      config: Development
    test:
      config: Development
      targets:
        - LumeoAdminTests
        - LumeoAdminUITests
    archive:
      config: Production
