services:
  postgres:
    image: postgres:16
    container_name: lumeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumeo
      POSTGRES_PASSWORD: lumeo
      POSTGRES_DB: lumeo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
